name: NanoPino quality

on:
  push:
    paths:
      - 'payload/**'
      - 'tests/php/**'
      - 'tests/release/**'
      - 'tools/**'
      - 'manifest.json'
      - 'docs/**'
      - '.github/workflows/nanopino-quality.yml'
  pull_request:
    paths:
      - 'payload/**'
      - 'tests/php/**'
      - 'tests/release/**'
      - 'tools/**'
      - 'manifest.json'
      - 'docs/**'
      - '.github/workflows/nanopino-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, xml, ctype, json, tokenizer, fileinfo
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install CMS frontend dependencies
        working-directory: payload/theme/cms-admin
        run: npm ci --no-audit --no-fund

      - name: PHP syntax and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          find payload -type f -name '*.php' \
            -not -path '*/theme/cms-admin/node_modules/*' \
            -not -path '*/theme/cms-admin/dist/*' \
            -print0 | xargs -0 -n1 php -l
          php tests/php/run.php
          node --test tests/release/*.test.mjs
          bash tools/release/verify-source.sh

      - name: Frontend tests
        working-directory: payload/theme/cms-admin
        run: npm test

      - name: Production build and parity
        working-directory: payload/theme/cms-admin
        run: npm run build
