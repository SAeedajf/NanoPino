name: Validate source

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-runtime:
    name: PHP runtime ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Execute NanoPino PHP runtime suite
        run: php tests/php/run.php

  verify:
    needs: php-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: payload/theme/cms-admin/package-lock.json

      - name: Install locked admin dependencies
        working-directory: payload/theme/cms-admin
        run: npm ci

      - name: Build production admin
        working-directory: payload/theme/cms-admin
        run: npm run build

      - name: Verify NanoPino source and generated runtime
        run: tools/release/verify-source.sh

      - name: Upload verified production admin
        uses: actions/upload-artifact@v4
        with:
          name: nanopino-admin-dist
          path: payload/theme/cms-admin/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  pinoox-lifecycle:
    name: PINX lifecycle / Pincore ${{ matrix.pincore }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pincore: '3.14.0'
            fault_injection: '0'
          - pincore: '3.14.4'
            fault_injection: '1'
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pinoox
          MYSQL_USER: pinoox_ci
          MYSQL_PASSWORD: pinoox_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: pinoox
      DB_USERNAME: pinoox_ci
      DB_PASSWORD: pinoox_ci
      DB_PREFIX: pinx_
      PINOOX_E2E_REF: 5e7d65bb4c6c71edbf0e0b47735479f620640d07
      PINCORE_E2E_VERSION: ${{ matrix.pincore }}
      NANOPINO_FAULT_INJECTION: ${{ matrix.fault_injection }}
      NANOPINO_UPGRADE_BASE_REF: 6f251890a503fa9968dcbe36c6d8e8604f00618b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure ephemeral lifecycle environment
        shell: bash
        run: |
          set -euo pipefail
          echo "NANOPINO_CI_ADMIN_PASSWORD=NanoPino-${GITHUB_RUN_ID}-${PINCORE_E2E_VERSION}-CI" >> "$GITHUB_ENV"
          echo "NANOPINO_PINX_OUTPUT=${RUNNER_TEMP}/NanoPino-e2e.pinx" >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip, mbstring, xml, ctype, fileinfo
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore verified production admin
        uses: actions/download-artifact@v4
        with:
          name: nanopino-admin-dist
          path: payload/theme/cms-admin/dist

      - name: Prepare pinned Pinoox runtime
        shell: bash
        run: |
          set -euo pipefail
          PINOX_ROOT="${RUNNER_TEMP}/pinoox"
          git clone --filter=blob:none https://github.com/pinoox/pinoox.git "$PINOX_ROOT"
          git -C "$PINOX_ROOT" checkout --detach "$PINOOX_E2E_REF"
          (
            cd "$PINOX_ROOT"
            composer require "pinoox/pincore:${PINCORE_E2E_VERSION}" --no-update --no-interaction
            composer update --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
            php -r '
              $config=require "vendor/pinoox/pincore/config/pincore.config.php";
              $expected=getenv("PINCORE_E2E_VERSION");
              $actual=(string)($config["version_name"]??"");
              if ($actual!==$expected) {
                  fwrite(STDERR,"Resolved Pincore version mismatch: expected=$expected actual=$actual\n");
                  exit(1);
              }
              printf("pincore_version=%s code=%d\n",$actual,(int)($config["version_code"]??0));
            '
            composer show pinoox/pincore
          )
          echo "PINOX_ROOT=$PINOX_ROOT" >> "$GITHUB_ENV"

      - name: Build upgrade fresh-install and uninstall NanoPino PINX
        run: bash tools/ci/pinoox-lifecycle.sh

      - name: Upload verified PINX lifecycle artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanopino-pinx-e2e-pincore-${{ matrix.pincore }}
          path: ${{ runner.temp }}/NanoPino-e2e.pinx
          if-no-files-found: error
          retention-days: 7
